name: SVN → Git mirror

# This workflow mirrors an SVN repository (qmmp-dev on SourceForge) to a
# Git repository on GitHub.  It runs on a 12-hour schedule, supports manual
# triggering, and incrementally syncs new SVN revisions by parsing the SVN
# log and replaying each revision as a Git commit on the appropriate branch.

on:
  schedule:
    - cron: '17 */12 * * *'      # Every 12 hours at :17 past the hour (offset to avoid GH load)
  workflow_dispatch:            # Manual "Run workflow" button in the Actions UI
  push:
    # The branch name is deliberately non-existent so this trigger only fires
    # when the workflow file itself is pushed (for testing config changes).
    branches: [ never-because-the-repository-was-seeded-already ]
    paths:
      - '.github/workflows/svn-mirror.yml'

permissions:
  contents: write               # Allow the GITHUB_TOKEN to push commits/tags

concurrency:
  group: svn-mirror             # Ensure only one mirror run at a time
  cancel-in-progress: false     # Don't cancel a running sync — let it finish

env:
  SVN_URL: svn://svn.code.sf.net/p/qmmp-dev/code/

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:

      # 
      # Step 1: Install the SVN client (not pre-installed on ubuntu-latest)
      # 
      - name: Install subversion
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y subversion

      # 
      # Step 2: Configure Git identity for the commits we'll create
      # 
      - name: Configure Git identity
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 
      # Step 3: Clone the existing Git mirror so we have history to append to
      # 
      - name: Clone existing mirror from GitHub
        run: |
          set -euo pipefail
          # Use the built-in GITHUB_TOKEN for authentication
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" mirror
          cd mirror
          # Detach HEAD so Git doesn't complain when we force-fetch and update
          # all branches (you can't update the branch you're currently on).
          git checkout --detach
          # Fetch all branches and tags from origin (the '+' means force-update)
          git fetch origin '+refs/heads/*:refs/heads/*'
          git fetch origin '+refs/tags/*:refs/tags/*'

      # 
      # Step 4: Core sync logic — fetch new SVN revisions and replay them
      # 
      - name: Sync new SVN revisions
        run: |
          set -euo pipefail
          cd mirror

          #  4a: Determine the last SVN revision already mirrored 
          # Every commit we create ends with a trailer like:
          #   git-svn-id: svn://svn.code.sf.net/p/qmmp-dev/code/@1234
          # We search across ALL branches (not just master) to find the absolute highest synced revision. This prevents re-walking logs if the latest SVN activity only touched branches/tags.
          # Map each (branch, SVN revision) pair to the git commit that represents it. Keyed by branch (not just revision) because a single SVN revision can legitimately produce commits on more than one branch — e.g. one atomic SVN commit that touches both /trunk and an existing /branches/X. Each such commit still has exactly one parent, on its own branch's line of history; the ambiguity was purely in how we were looking them back up.
          declare -A rev_to_sha
          for ref in $(git for-each-ref --format='%(refname:short)' refs/heads); do
            while IFS= read -r -d '' sha && IFS= read -r -d '' body; do
              sha="${sha#$'\n'}"
              rev=$(printf '%s' "$body" | grep -oP 'git-svn-id:.*@\K[0-9]+' | tail -1 || true)
              [ -n "$rev" ] && rev_to_sha["$ref:$rev"]="$sha"
            done < <(git log "$ref" --format='%H%x00%B%x00' 2>/dev/null)
          done
          
          if [ ${#rev_to_sha[@]} -gt 0 ]; then
            LAST_REV=$(printf '%s\n' "${!rev_to_sha[@]}" | sed 's/^.*://' | sort -n | tail -1)
          else
            LAST_REV=0
          fi
          echo "Current mirrored SVN revision: r$LAST_REV"

          START_REV=$((LAST_REV + 1))

          #  4b: Fetch the SVN log for all new revisions 
          # `svn log -r START:HEAD` returns all revisions from START to the latest.  If START is beyond HEAD (no new revisions), svn log exits non-zero. We handle that gracefully.
          if ! svn --non-interactive log -v -r "$START_REV:HEAD" "$SVN_URL" > /tmp/svn_log.txt 2>/dev/null; then
            echo "No new revisions to sync (svn log returned no results or failed)."
            exit 0
          fi

          # Secondary check: if the file is empty or has only 1 line, there's
          # nothing useful in it.
          if [ ! -s /tmp/svn_log.txt ] || [ "$(wc -l < /tmp/svn_log.txt)" -le 1 ]; then
            echo "No new revisions to sync."
            exit 0
          fi

          #  4c: Parse and process each SVN revision 
          # SVN log entries are separated by a line of exactly 72 dashes.
          # We use awk with RS="-{72}" to split the file into records, then
          # pipe each record (delimited by NUL) to a Bash while-loop.
          awk 'BEGIN{RS="-{72}"} NF>0 {print $0 "\x00"}' /tmp/svn_log.txt | while IFS= read -r -d '' block; do

            # Strip leading whitespace (awk records start with a newline)
            block="${block#"${block%%[![:space:]]*}"}"
            [ -z "$block" ] && continue

            #  Parse the header line: "r123 | author | date | n lines" 
            rev=$(echo "$block" | head -n1 | awk '{print $1}' | tr -d 'r')
            author=$(echo "$block" | head -n1 | awk -F'|' '{print $2}' | sed 's/^ *//;s/ *$//')
            git_date=$(echo "$block" | head -n1 | awk -F'|' '{print $3}' | awk '{print $1"T"$2" "$3}')

            #  Parse the "Changed paths" section 
            # Extract lines matching "   M /path" (3 spaces, action, space, path)
            mapfile -t path_lines < <(echo "$block" | sed -n '/Changed paths:/,/^$/p' | grep -E '^   [A-Z]')

            #  Parse the commit message 
            # Preserve multi-paragraph messages (don't skip interior blank lines)
            msg=$(echo "$block" | awk 'BEGIN{p=0} p{print} /^$/{p=1}')
            [ -z "$msg" ] && msg="<empty SVN commit message>"
            [ -z "$author" ] && author="unknown"

            echo "Processing r$rev by $author..."

            #  Group changed paths by their target Git branch 
            # (NOTE: D /branches/oldbranch (deleting the whole branch) just falls through to "branch doesn't exist locally, skip" or leaves the git branch dangling)
            declare -A branch_changes
            for pline in "${path_lines[@]}"; do
              # BUG FIX: path_lines entries look like "   M /trunk/file.c".
              # The action letter is at index 3 (after 3 spaces). The path
              # starts at index 4 (space after action). Stripping just 1 char
              # missed the action letter and glued it to the path, breaking
              # branch routing. Now we slice exactly:
              #   action = index 3
              #   rest   = index 4 onward, with leading spaces trimmed
              action=${pline:3:1}
              rest=$(echo "${pline:4}" | sed 's/^ *//')

              # Extract copyfrom info if present
              copyfrom=$(echo "$rest" | sed -n 's/.* (from \(.*\))/\1/p')
              if [ -n "$copyfrom" ]; then
                rest=$(echo "$rest" | sed 's/ (from.*//')
              fi

              git_branch=""
              local_path=""

              if [[ "$rest" == "/trunk"* ]]; then
                git_branch="master"
                local_path="${rest#/trunk/}"
                [ "$local_path" == "$rest" ] && local_path=""
              elif [[ "$rest" == "/branches/"* ]]; then
                tmp=${rest#/branches/}
                git_branch=${tmp%%/*}
                if [[ "$tmp" == */* ]]; then
                  local_path=${tmp#*/}
                else
                  local_path=""
                fi
              elif [[ "$rest" == "/tags/"* ]]; then
                tmp=${rest#/tags/}
                tag_name=${tmp%%/*}
                git_branch="tag_$tag_name"
                if [[ "$tmp" == */* ]]; then
                  local_path=${tmp#*/}
                else
                  local_path=""
                fi
              fi
              [ -z "$git_branch" ] && { echo "  WARNING: unroutable path, skipping: $rest"; continue; }
              # Accumulate this change into the branch's change list
              if [ -z "${branch_changes[$git_branch]-}" ]; then
                branch_changes[$git_branch]="$action|$local_path|$copyfrom"
              else
                branch_changes[$git_branch]+=$'\n'"$action|$local_path|$copyfrom"
              fi
            done

            #  Apply changes to each affected branch or tag 
            for git_branch in "${!branch_changes[@]}"; do

              #  Tag handling 
              if [[ "$git_branch" == tag_* ]]; then
                tag_name=${git_branch#tag_}
                while IFS= read -r change; do
                  IFS='|' read -r action local_path copyfrom <<< "$change"
                  if [ "$action" == "A" ] && [ -n "$copyfrom" ]; then
                    src_ref="master"
                    src_tag=""
                    if [[ "$copyfrom" == "/branches/"* ]]; then
                      src_ref=$(echo "$copyfrom" | sed 's|/branches/\([^/]*\).*|\1|')
                    elif [[ "$copyfrom" == "/tags/"* ]]; then
                      # Copied from a tag rather than trunk/a branch. Tags have
                      # no commit history of their own — they're a fixed
                      # pointer to a commit on whatever branch they were cut
                      # from — so the useful reference is the tag ref itself,
                      # not a (branch, revision) lookup.
                      src_tag=$(echo "$copyfrom" | sed 's|/tags/\([^/]*\).*|\1|')
                      src_ref="refs/tags/$src_tag"
                    fi

                    # Create tags at the exact source revision if possible
                    src_rev=$(echo "$copyfrom" | sed -n 's/.*:r\{0,1\}\([0-9]*\)$/\1/p')
                    src_commit=""
                    if [ -n "$src_tag" ]; then
                      src_commit=$(git rev-parse --verify --quiet "refs/tags/$src_tag" 2>/dev/null || true)
                    elif [ -n "$src_rev" ]; then
                      src_commit="${rev_to_sha["$src_ref:$src_rev"]-}"
                    fi
                    if ! git rev-parse --verify --quiet "refs/tags/$tag_name" >/dev/null; then
                      if [ -n "$src_commit" ]; then
                        git tag "$tag_name" "$src_commit"
                        echo "  Created tag $tag_name at commit $src_commit (SVN r$src_rev)"
                      else
                        git tag "$tag_name" "$src_ref"
                        echo "  Created tag $tag_name from $src_ref (fallback)"
                      fi
                    fi
                  fi
                done <<< "${branch_changes[$git_branch]}"
                continue
              fi

              #  Branch creation detection 
              while IFS= read -r change; do
                IFS='|' read -r action local_path copyfrom <<< "$change"
                if [ "$action" == "A" ] && [ -n "$copyfrom" ] && [ -z "$local_path" ]; then
                  src_ref="master"
                  if [[ "$copyfrom" == "/branches/"* ]]; then
                    src_ref=$(echo "$copyfrom" | sed 's|/branches/\([^/]*\).*|\1|')
                  fi

                  # Create branches at the exact source revision if possible
                  src_rev=$(echo "$copyfrom" | sed -n 's/.*:r\{0,1\}\([0-9]*\)$/\1/p')
                  src_commit=""
                  if [ -n "$src_rev" ]; then
                    src_commit="${rev_to_sha["$src_ref:$src_rev"]-}"
                  fi

                  if ! git rev-parse --verify --quiet "$git_branch" >/dev/null; then
                    if [ -n "$src_commit" ]; then
                      git branch "$git_branch" "$src_commit"
                      echo "  Created branch $git_branch at commit $src_commit (SVN r$src_rev)"
                    else
                      git branch "$git_branch" "$src_ref"
                      echo "  Created branch $git_branch from $src_ref (fallback)"
                    fi
                  fi
                fi
              done <<< "${branch_changes[$git_branch]}"

              if ! git rev-parse --verify --quiet "$git_branch" >/dev/null; then
                echo "  Branch $git_branch does not exist, skipping."
                continue
              fi

              #  Apply file-level changes to the branch 
              git checkout -f "$git_branch"

              while IFS= read -r change; do
                IFS='|' read -r action local_path copyfrom <<< "$change"
                [ -z "$local_path" ] && continue
                case "$local_path" in
                  *..*) echo "  WARNING: suspicious path, skipping: $local_path"; continue ;;
                esac
                if [ "$action" == "D" ]; then
                  git rm -rf --ignore-unmatch "$local_path"
                else
                  if [[ "$git_branch" == "master" ]]; then
                    svn_target="$SVN_URL/trunk/$local_path"
                  else
                    svn_target="$SVN_URL/branches/$git_branch/$local_path"
                  fi

                  mkdir -p "$(dirname "$local_path")"

                  # Try `svn cat` first (files), fall back to `svn export` (directories)
                  if svn --non-interactive cat -r "$rev" "$svn_target" > "$local_path" 2>/dev/null; then
                    git add "$local_path"
                  else
                    svn --non-interactive export -r "$rev" --force "$svn_target" "$local_path"
                    git add -A "$local_path"
                  fi
                fi
              done <<< "${branch_changes[$git_branch]}"

              #  Commit if there are staged changes 
              if ! git diff --cached --quiet; then
                git config user.name "$author"
                git config user.email "$author@users.noreply.github.com"

                commit_msg="$msg"$'\n\n'"git-svn-id: $SVN_URL@$rev"
                GIT_AUTHOR_DATE="$git_date" GIT_COMMITTER_DATE="$git_date" git commit -m "$commit_msg"
                rev_to_sha["$git_branch:$rev"]="$(git rev-parse HEAD)"
                echo "  Committed r$rev to $git_branch"
              else
                echo "  No changes to commit for r$rev on $git_branch"
              fi
            done
          done
          echo "Sync complete."

      # 
      # Step 5: Push the updated mirror back to GitHub
      # 
      - name: Push mirror to GitHub
        run: |
          set -euo pipefail
          cd mirror
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          # a normal push should always fast-forward, so we do not use the --force flag
          git push "$REMOTE" 'refs/heads/*:refs/heads/*'
          git push "$REMOTE" 'refs/tags/*:refs/tags/*'
      
      # 
      # Step 6: Update README.md on svn-sync-entrypoint with latest mirror state
      # 
      - name: Update README.md on svn-sync-entrypoint
        run: |
          set -euo pipefail
          cd mirror
          git checkout -f svn-sync-entrypoint
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          
          # Gather repository state information from ALL branches
          LATEST_REV=$(git log --all --format='%B' 2>/dev/null | grep -oP 'git-svn-id:.*@\K[0-9]+' | sort -n | tail -1 || true)
          [ -z "$LATEST_REV" ] && LATEST_REV="unknown"
          
          # Find the Git commit SHA for the latest revision to link it
          LATEST_SHA=""
          if [ "$LATEST_REV" != "unknown" ]; then
            for ref in $(git for-each-ref --format='%(refname:short)' refs/heads); do
              # Use git's native grep to find the exact commit and extract just the hash
              sha=$(git log "$ref" --extended-regexp --grep="git-svn-id:.*@${LATEST_REV}( |$)" --format='%H' -1 2>/dev/null || true)          
              if [ -n "$sha" ]; then
                # If multiple branches have the same latest rev, pick the first one (usually master)
                LATEST_SHA="$sha"
                break
              fi
            done
          fi
          
          if [ -n "$LATEST_SHA" ]; then
            REV_MD="[\`r${LATEST_REV}\`](${REPO_URL}/commit/${LATEST_SHA})"
          else
            REV_MD="r${LATEST_REV}"
          fi
          SYNC_TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          # Get branches (excluding svn-sync-entrypoint) formatted as inline links
          BRANCH_LIST=$(git for-each-ref --format='%(refname:short)' refs/heads 2>/dev/null | grep -v '^svn-sync-entrypoint$' | sort || true)
          if [ -n "$BRANCH_LIST" ]; then
            BRANCH_COUNT=$(echo "$BRANCH_LIST" | wc -l)
            #                                          .* instead of ^ so the ampersand (&) captures the full branch name
            BRANCHES_MD=$(echo "$BRANCH_LIST" | sed "s|.*|[\`&\`](${REPO_URL}/tree/&)|" | paste -sd ' ')
          else
            BRANCH_COUNT=0
            BRANCHES_MD="*None*"
          fi
          # Get tags formatted as inline links
          TAG_COUNT=$(git tag 2>/dev/null | wc -l || echo 0)
          TAG_COUNT=$((TAG_COUNT))
          if [ "$TAG_COUNT" -gt 0 ]; then
            TAG_LIST=$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags 2>/dev/null | head -20)
            TAGS_MD=$(echo "$TAG_LIST" | sed "s|^|[\`&\`](${REPO_URL}/releases/tag/&)|" | paste -sd ' ')
            if [ "$TAG_COUNT" -gt 20 ]; then
              TAGS_MD="${TAGS_MD} [+${TAG_COUNT - 20} more](${REPO_URL}/tags)"
            fi
          else
            TAGS_MD="*None*"
          fi
          # Generate the new state block
          NEW_STATE=$(cat <<EOF
          ### Mirror Status

          | Field | Value |
          |-------|-------|
          | Latest SVN revision | ${REV_MD} |
          | Last synced | ${SYNC_TIMESTAMP} |
          | Branches (${BRANCH_COUNT}) | ${BRANCHES_MD} |
          | Tags (${TAG_COUNT}) | ${TAGS_MD} |
          EOF
          )
          # Surgically replace the old state block if it exists, otherwise append it
          if grep -q '^### Mirror Status$' README.md; then
            # Use awk to replace everything from "## Mirror Status" to the next top-level heading (or EOF)
            awk -v new_state="$NEW_STATE" '
              BEGIN { state=1 }
              /^### Mirror Status$/ { 
                printf "%s\n\n", new_state
                state=0
                next 
              }
              state && /^## [A-Z]/ && !/^### Mirror Status$/ { state=1 }
              state { print }
            ' README.md > README.md.tmp && mv README.md.tmp README.md
          else
            # No existing state block; append after the existing intro
            printf "\n%s\n" "$NEW_STATE" >> README.md
          fi
          # Commit and push if changed
          git add README.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: update README with mirror state (r${LATEST_REV})"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" svn-sync-entrypoint
            echo "README.md updated on svn-sync-entrypoint"
          else
            echo "README.md unchanged, skipping commit"
          fi
