name: SVN → Git mirror

on:
  schedule:
    - cron: '17 */12 * * *'      # (offset to avoid GH load)
  workflow_dispatch:            # manual "Run workflow" button
  push:
    branches: [ never-because-the-repository-was-seeded-already ]
    paths:
      - '.github/workflows/svn-mirror.yml'
permissions:
  contents: write               # so GITHUB_TOKEN can push
  # workflows: write              # allows pushing refs that contain workflow files (i.e. branch `svn-to-git-sync`)
concurrency:
  group: svn-mirror
  cancel-in-progress: false

env:
  SVN_URL: svn://svn.code.sf.net/p/qmmp-dev/code/

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Install subversion
        run: |
          sudo apt-get update -y
          sudo apt-get install -y subversion

      - name: Configure Git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone existing mirror from GitHub
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" mirror
          cd mirror
          git fetch origin '+refs/heads/*:refs/heads/*'
          git fetch origin '+refs/tags/*:refs/tags/*'

      - name: Sync new SVN revisions
        run: |
          cd mirror
          python3 << 'EOF'
          import subprocess
          import xml.etree.ElementTree as ET
          import os
          import re
          import sys
          from datetime import datetime

          SVN_URL = os.environ.get('SVN_URL', '').rstrip('/')

          def run(cmd, check=True, capture=True):
              if capture:
                  return subprocess.run(cmd, check=check, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              else:
                  return subprocess.run(cmd, check=check)

          # 1. Find the last synced SVN revision from the master branch's git-svn-id trailer
          res = run(['git', 'log', '-1', 'master', '--format=%B'], check=False)
          last_rev = 0
          if res.returncode == 0:
              match = re.search(r'git-svn-id: .*@(\d+)', res.stdout)
              if match:
                  last_rev = int(match.group(1))

          print(f"Current mirrored SVN revision: r{last_rev}")

          # 2. Fetch SVN logs for all new revisions
          start_rev = last_rev + 1
          res = run(['svn', 'log', '-r', f'{start_rev}:HEAD', '--xml', '-v', SVN_URL])
          if not res.stdout.strip():
              print("No new revisions to sync.")
              sys.exit(0)

          root = ET.fromstring(res.stdout)
          logentries = root.findall('logentry')
          if not logentries:
              print("No new revisions to sync.")
              sys.exit(0)

          # 3. Process each new SVN revision
          for entry in logentries:
              rev = entry.get('revision')
              author = entry.find('author').text or 'unknown'
              date_str = entry.find('date').text
              msg = entry.find('msg').text or ''
              
              # Parse SVN timestamp to Git format
              dt = datetime.strptime(date_str[:19], '%Y-%m-%dT%H:%M:%S')
              git_date = dt.strftime('%Y-%m-%dT%H:%M:%S')

              print(f"Processing r{rev} by {author} on {git_date}...")
              
              paths_elem = entry.find('paths')
              if paths_elem is None:
                  continue

              branch_changes = {}
              
              # Group changes by Git branch
              for path_elem in paths_elem.findall('path'):
                  action = path_elem.get('action', 'M')
                  p = path_elem.text.strip().strip('/')
                  copyfrom_path = path_elem.get('copyfrom-path', '').strip('/')
                  kind = path_elem.get('kind', 'file')

                  # Handle SVN branch/tag copies natively
                  if action == 'A' and copyfrom_path:
                      src_git_ref = 'master'
                      if copyfrom_path.startswith('branches/'):
                          src_git_ref = copyfrom_path.split('/')[1]
                      elif copyfrom_path.startswith('tags/'):
                          src_git_ref = copyfrom_path.split('/')[1]
                      
                      if p.startswith('branches/'):
                          new_branch = p.split('/')[1]
                          if run(['git', 'rev-parse', '--verify', new_branch], check=False).returncode != 0:
                              run(['git', 'branch', new_branch, src_git_ref])
                              print(f"Created branch {new_branch} from {src_git_ref}")
                      elif p.startswith('tags/'):
                          new_tag = p.split('/')[1]
                          if run(['git', 'rev-parse', '--verify', f'refs/tags/{new_tag}'], check=False).returncode != 0:
                              run(['git', 'tag', new_tag, src_git_ref])
                              print(f"Created tag {new_tag} from {src_git_ref}")
                      continue

                  # Map SVN paths to Git branches
                  if p.startswith('trunk/'):
                      git_ref = 'master'
                      local_path = p[len('trunk/'):]
                      svn_path = f"{SVN_URL}/trunk/{local_path}"
                  elif p.startswith('branches/'):
                      parts = p.split('/', 2)
                      if len(parts) == 3:
                          git_ref = parts[1]
                          local_path = parts[2]
                          svn_path = f"{SVN_URL}/branches/{git_ref}/{local_path}"
                      else:
                          continue
                  elif p.startswith('tags/'):
                      # Ignore file modifications inside tags (tags should be immutable snapshots)
                      continue
                  else:
                      continue

                  local_path = local_path.rstrip('/')
                  if git_ref not in branch_changes:
                      branch_changes[git_ref] = []
                  branch_changes[git_ref].append((action, local_path, svn_path, kind))

              # Apply file changes and commit per branch
              for git_ref, changes in branch_changes.items():
                  if run(['git', 'rev-parse', '--verify', git_ref], check=False).returncode != 0:
                      print(f"Branch {git_ref} does not exist in Git, skipping.")
                      continue
                  
                  run(['git', 'checkout', '-f', git_ref], check=False)
                  
                  for action, local_path, svn_path, kind in changes:
                      if action in ['A', 'M', 'R']:
                          if kind == 'dir':
                              os.makedirs(local_path, exist_ok=True)
                              run(['svn', 'export', '-r', rev, '--force', svn_path, local_path])
                              run(['git', 'add', '-A', local_path])
                          else:
                              os.makedirs(os.path.dirname(local_path) or '.', exist_ok=True)
                              # Fetch file contents directly from SVN
                              res_cat = subprocess.run(['svn', 'cat', '-r', rev, svn_path], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                              if res_cat.returncode == 0:
                                  with open(local_path, 'wb') as f:
                                      f.write(res_cat.stdout)
                              else:
                                  print(f"Failed to cat {svn_path}: {res_cat.stderr.decode()}")
                              run(['git', 'add', local_path])
                      elif action == 'D':
                          run(['git', 'rm', '-rf', '--ignore-unmatch', local_path], check=False)

                  # Create the Git commit
                  status = run(['git', 'status', '--porcelain'])
                  if status.stdout.strip():
                      run(['git', 'config', 'user.name', author])
                      run(['git', 'config', 'user.email', f'{author}@users.noreply.github.com'])
                      commit_msg = f"{msg}\n\ngit-svn-id: {SVN_URL}@{rev}"
                      env = os.environ.copy()
                      env['GIT_AUTHOR_DATE'] = git_date
                      env['GIT_COMMITTER_DATE'] = git_date
                      subprocess.run(['git', 'commit', '-m', commit_msg], env=env, check=False)
                      print(f"Committed r{rev} to {git_ref}")
                  else:
                      print(f"No changes to commit for r{rev} on {git_ref}")

          print("Sync complete.")
          EOF

      - name: Push mirror to GitHub
        run: |
          cd mirror
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force "$REMOTE" 'refs/heads/*:refs/heads/*'
          git push --force "$REMOTE" 'refs/tags/*:refs/tags/*'
