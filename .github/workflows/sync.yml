#!/bin/bash
set -euo pipefail

SVN_URL="svn://svn.code.sf.net/p/qmmp-dev/code/trunk"

# 1. Find the last synced SVN revision from Git's commit history
LAST_REV=$(git log -1 --grep="git-svn-id:" --format=%B | grep -oP 'trunk@\K\d+')
NEXT_REV=$((LAST_REV + 1))

echo "Last synced revision: $LAST_REV. Fetching from $NEXT_REV..."

# 2. Get a list of new revisions (oldest to newest)
REVS=$(svn log -q -r ${NEXT_REV}:HEAD "$SVN_URL" 2>/dev/null | awk '/^r[0-9]+/ {print substr($1, 2)}' | tac || true)

if [ -z "$REVS" ]; then
  echo "No new revisions found."
  exit 0
fi

# 3. Loop through and apply each revision
for REV in $REVS; do
  echo "Syncing r$REV..."
  
  # Extract metadata
  AUTHOR=$(svn log -r $REV "$SVN_URL" | sed -n '2p' | awk -F '|' '{print $2}' | xargs)
  DATE=$(svn log -r $REV "$SVN_URL" | sed -n '2p' | awk -F '|' '{print $3}' | xargs)
  MSG=$(svn log -r $REV "$SVN_URL" | sed -e '1,3d' -e '$d')

  # Apply changes: diff + git apply
  # We use patch to handle file modifications and additions
  svn diff -c $REV "$SVN_URL" > /tmp/svn.patch
  
  if [ -s /tmp/svn.patch ]; then
    git apply /tmp/svn.patch
  fi

  # 🚨 THE BASH TRAP: svn diff doesn't handle binary files well, and git apply 
  # can fail on complex directory renames or file deletions.
  # A safer but slower alternative is wiping the Git working tree 
  # and doing a full `svn export --force -r $REV $SVN_URL .`
  
  # Add and commit to Git
  git add -A
  
  # Reconstruct the git-svn-id trailer so the next run knows where we left off
  COMMIT_MSG=$(printf "%s\n\ngit-svn-id: %s@%s\n" "$MSG" "$SVN_URL" "$REV")
  
  GIT_COMMITTER_DATE="$DATE" GIT_AUTHOR_DATE="$DATE" \
  GIT_COMMITTER_NAME="$AUTHOR" GIT_AUTHOR_NAME="$AUTHOR" \
  GIT_COMMITTER_EMAIL="$AUTHOR@noreply" GIT_AUTHOR_EMAIL="$AUTHOR@noreply" \
  git commit -q -m "$COMMIT_MSG"
done

echo "Sync complete."
