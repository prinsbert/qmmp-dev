name: Delete old workflow runs
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete runs older than 30 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Calculate the date 30 days ago in ISO 8601 format
          CUTOFF_DATE=$(date -d '30 days ago' --iso-8601)
          echo "Fetching runs (ignoring the 10 newest runs). Deleting runs older than $CUTOFF_DATE..."
          # 'gh run list' returns runs from newest to oldest.
          # jq skips the first 10 runs (.[10:]), filters by date, and extracts the ID.
          gh run list --limit 1000 --json databaseId,createdAt --jq ".[10:] | .[] | select(.createdAt < \"$CUTOFF_DATE\") | .databaseId" \
            | while read run_id; do
                echo "Deleting run ID: $run_id"
                gh run delete "$run_id"
              done
