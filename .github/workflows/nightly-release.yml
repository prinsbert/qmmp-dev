name: Nightly Build

on:
  # schedule:
    # # Run daily at 03:00 UTC
    # - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even without new commits'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

env:
  BUILD_TYPE: Release

jobs:
  # ==========================================================================
  # Job 1: Check if there are new commits since the last nightly build
  # ==========================================================================
  check-for-updates:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      commit_sha: ${{ steps.check.outputs.commit_sha }}
      short_sha: ${{ steps.check.outputs.short_sha }}
      build_date: ${{ steps.check.outputs.build_date }}
      commit_message: ${{ steps.check.outputs.commit_message }}
      commit_author: ${{ steps.check.outputs.commit_author }}
      commit_date: ${{ steps.check.outputs.commit_date }}
      commits_count: ${{ steps.check.outputs.commits_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Check for new commits
        id: check
        run: |
          # Get current commit info
          CURRENT_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(echo "${CURRENT_SHA}" | cut -c1-8)
          BUILD_DATE=$(date -u +'%Y-%m-%d')
          
          COMMIT_MESSAGE=$(git log -1 --pretty=format:"%s")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an <%ae>")
          COMMIT_DATE=$(git log -1 --pretty=format:"%ai")
          
          # Count commits since last nightly (if exists)
          LAST_NIGHTLY_SHA=""
          if gh release view nightly --json body -q '.body' 2>/dev/null; then
            LAST_NIGHTLY_SHA=$(gh release view nightly --json body -q '.body' | grep -oP 'Commit SHA: \K[a-f0-9]{40}' || echo "")
          fi
          
          if [ -n "${LAST_NIGHTLY_SHA}" ]; then
            COMMITS_COUNT=$(git rev-list "${LAST_NIGHTLY_SHA}..HEAD" --count)
          else
            COMMITS_COUNT="N/A (first nightly)"
          fi
          
          # Determine if we should build
          FORCE_BUILD="${{ github.event.inputs.force_build }}"
          
          if [ "${FORCE_BUILD}" = "true" ]; then
            SHOULD_BUILD="true"
            REASON="Manual force build triggered"
          elif [ -z "${LAST_NIGHTLY_SHA}" ]; then
            SHOULD_BUILD="true"
            REASON="First nightly build (no previous release found)"
          elif [ "${CURRENT_SHA}" != "${LAST_NIGHTLY_SHA}" ]; then
            SHOULD_BUILD="true"
            REASON="New commits detected (${COMMITS_COUNT} commit(s) since last build)"
          else
            SHOULD_BUILD="false"
            REASON="No new commits since last build"
          fi
          
          # Set outputs
          echo "should_build=${SHOULD_BUILD}" >> $GITHUB_OUTPUT
          echo "commit_sha=${CURRENT_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "commit_message=${COMMIT_MESSAGE}" >> $GITHUB_OUTPUT
          echo "commit_author=${COMMIT_AUTHOR}" >> $GITHUB_OUTPUT
          echo "commit_date=${COMMIT_DATE}" >> $GITHUB_OUTPUT
          echo "commits_count=${COMMITS_COUNT}" >> $GITHUB_OUTPUT
          
          echo "========================================"
          echo "Nightly Build Check Results"
          echo "========================================"
          echo "Should Build: ${SHOULD_BUILD}"
          echo "Reason: ${REASON}"
          echo "Current SHA: ${CURRENT_SHA}"
          echo "Last Nightly SHA: ${LAST_NIGHTLY_SHA:-None}"
          echo "Commits Since Last: ${COMMITS_COUNT}"
          echo "========================================"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Job 2: Build on Linux (Ubuntu) - Binary Tarball
  # ==========================================================================
  build-linux-binary:
    needs: check-for-updates
    if: needs.check-for-updates.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          path: qmmp-src

      - name: Install required dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            tar \
            unzip \
            bzip2 \
            gzip \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libmad0-dev \
            libvorbis-dev \
            libogg-dev \
            libasound2-dev \
            libtag1-dev \
            libcurl4-openssl-dev

      - name: Install optional dependencies
        run: |
          sudo apt-get install -y \
            libmpg123-dev \
            qtmultimedia6-dev \
            libflac-dev \
            libmpcdec-dev \
            libjack-jackd2-dev \
            libsoxr-dev \
            libxmp-dev \
            libsndfile1-dev \
            libwavpack-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libcdio-dev \
            libcdio-paranoia-dev \
            libcddb2-dev \
            libfaad-dev \
            libgme-dev \
            libopus-dev \
            libopusfile-dev \
            libwildmidi-dev \
            libsidplayfp-dev \
            libbs2b-dev \
            libprojectm-dev \
            libenca-dev \
            libarchive-dev \
            libshout3-dev \
            libx11-dev \
            libxcb1-dev \
            x11proto-dev \
            librcd0-dev \
            libmms-dev || true

      - name: Configure with CMake
        run: |
          mkdir -p qmmp-src/build && cd qmmp-src/build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DUSE_QTMULTIMEDIA=TRUE \
            -DUSE_PIPEWIRE=TRUE \
            -DUSE_PROJECTM=TRUE \
            -DUSE_LIBCDDB=TRUE \
            -DQMMP_DEFAULT_UI=qsui

      - name: Build
        run: |
          cd qmmp-src/build
          ninja -j$(nproc)

      - name: Install to staging directory
        run: |
          cd qmmp-src/build
          DESTDIR=${{ github.workspace }}/staging-binary ninja install

      - name: Create binary tarball
        run: |
          cd ${{ github.workspace }}
          tar -czf qmmp-${{ needs.check-for-updates.outputs.build_date }}-linux-x86_64-binary.tar.gz -C staging-binary .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmmp-linux-binary
          path: qmmp-*-linux-x86_64-binary.tar.gz
          retention-days: 7

  # ==========================================================================
  # Job 3: Build on Linux (Ubuntu) - AppImage
  # ==========================================================================
  build-linux-appimage:
    needs: check-for-updates
    if: needs.check-for-updates.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          path: qmmp-src

      - name: Install required dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            tar \
            unzip \
            bzip2 \
            gzip \
            qt6-base-dev \
            qt6-base-private-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libmad0-dev \
            libvorbis-dev \
            libogg-dev \
            libasound2-dev \
            libtag1-dev \
            libcurl4-openssl-dev \
            file \
            fuse

      - name: Install optional dependencies
        run: |
          sudo apt-get install -y \
            libmpg123-dev \
            qtmultimedia6-dev \
            libflac-dev \
            libmpcdec-dev \
            libjack-jackd2-dev \
            libsoxr-dev \
            libxmp-dev \
            libsndfile1-dev \
            libwavpack-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libcdio-dev \
            libcdio-paranoia-dev \
            libcddb2-dev \
            libfaad-dev \
            libgme-dev \
            libopus-dev \
            libopusfile-dev \
            libwildmidi-dev \
            libsidplayfp-dev \
            libbs2b-dev \
            libprojectm-dev \
            libenca-dev \
            libarchive-dev \
            libshout3-dev \
            libx11-dev \
            libxcb1-dev \
            x11proto-dev \
            librcd0-dev \
            libmms-dev \
            libgl1-mesa-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev || true

      - name: Configure with CMake for AppImage
        run: |
          mkdir -p qmmp-src/build && cd qmmp-src/build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DUSE_QTMULTIMEDIA=TRUE \
            -DUSE_PIPEWIRE=TRUE \
            -DUSE_PROJECTM=TRUE \
            -DUSE_LIBCDDB=TRUE \
            -DQMMP_DEFAULT_UI=qsui \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=FALSE \
            -DCMAKE_INSTALL_RPATH='$ORIGIN/../lib'

      - name: Build
        run: |
          cd qmmp-src/build
          ninja -j$(nproc)

      - name: Install to AppDir
        run: |
          mkdir -p ${{ github.workspace }}/AppDir
          cd qmmp-src/build
          DESTDIR=${{ github.workspace }}/AppDir ninja install

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage
          
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy-plugin-appimage-x86_64.AppImage

      - name: Create AppImage
        run: |
          # Create desktop file
          cat > ${{ github.workspace }}/AppDir/usr/share/applications/qmmp.desktop << 'EOF'
          [Desktop Entry]
          Name=Qmmp
          Comment=Qt-based Multimedia Player
          Exec=qmmp
          Icon=qmmp
          Type=Application
          Categories=AudioVideo;Audio;Player;
          MimeType=audio/x-mpegurl;audio/mpeg;audio/x-mp3;audio/flac;audio/ogg;audio/x-vorbis+ogg;audio/x-wav;
          Terminal=false
          StartupNotify=true
          EOF
          
          # Copy desktop file to AppDir root
          cp ${{ github.workspace }}/AppDir/usr/share/applications/qmmp.desktop ${{ github.workspace }}/AppDir/
          
          # Find and copy icon
          if [ -f ${{ github.workspace }}/AppDir/usr/share/icons/hicolor/128x128/apps/qmmp.png ]; then
            cp ${{ github.workspace }}/AppDir/usr/share/icons/hicolor/128x128/apps/qmmp.png ${{ github.workspace }}/AppDir/qmmp.png
          elif [ -f ${{ github.workspace }}/AppDir/usr/share/pixmaps/qmmp.png ]; then
            cp ${{ github.workspace }}/AppDir/usr/share/pixmaps/qmmp.png ${{ github.workspace }}/AppDir/qmmp.png
          else
            # Find any qmmp icon
            ICON=$(find ${{ github.workspace }}/AppDir -name "qmmp.png" 2>/dev/null | head -1)
            if [ -n "$ICON" ]; then
              cp "$ICON" ${{ github.workspace }}/AppDir/qmmp.png
            fi
          fi
          
          # Set QT_PLUGIN_PATH for linuxdeploy
          export QT_PLUGIN_PATH=/usr/lib/qt6/plugins
          
          # Create AppImage (with EXTRA_QT_PLUGINS for multimedia)
          ./linuxdeploy-x86_64.AppImage \
            --appdir ${{ github.workspace }}/AppDir \
            --plugin qt \
            --plugin appimage \
            -e ${{ github.workspace }}/AppDir/usr/bin/qmmp \
            -d ${{ github.workspace }}/AppDir/qmmp.desktop \
            -i ${{ github.workspace }}/AppDir/qmmp.png \
            --output appimage \
            -v2 \
            EXTRA_QT_PLUGINS="multimedia,multimediawidgets" \
            DEPLOY_GSTREAMER_PLUGINS="1" \
            || true
          
          # Find and rename the created AppImage
          APPIMAGE_FILE=$(find . -maxdepth 1 -name "Qmmp*.AppImage" -o -name "qmmp*.AppImage" 2>/dev/null | head -1)
          if [ -n "$APPIMAGE_FILE" ]; then
            mv "$APPIMAGE_FILE" "qmmp-${{ needs.check-for-updates.outputs.build_date }}-linux-x86_64.AppImage"
          fi
          
          # If no AppImage was created, create a simple one from AppDir
          if [ ! -f "qmmp-${{ needs.check-for-updates.outputs.build_date }}-linux-x86_64.AppImage" ]; then
            echo "linuxdeploy failed, creating minimal AppImage..."
            cd ${{ github.workspace }}/AppDir
            wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x appimagetool-x86_64.AppImage
            ./appimagetool-x86_64.AppImage --no-appstream ${{ github.workspace }}/AppDir \
              ${{ github.workspace }}/qmmp-${{ needs.check-for-updates.outputs.build_date }}-linux-x86_64.AppImage || true
          fi
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/AppDir/usr/lib:${{ github.workspace }}/AppDir/usr/lib/qmmp-*
          QMAKE: /usr/lib/qt6/bin/qmake

      - name: List AppDir contents for debugging
        if: always()
        run: |
          echo "=== AppDir Structure ==="
          find ${{ github.workspace }}/AppDir -type f 2>/dev/null | head -50
          echo "=== AppImage Files ==="
          ls -la *.AppImage 2>/dev/null || echo "No AppImage files found"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmmp-linux-appimage
          path: qmmp-*-linux-x86_64.AppImage
          retention-days: 7
          if-no-files-found: warn

  # ==========================================================================
  # Job 4: Build on macOS
  # ==========================================================================
  build-macos:
    needs: check-for-updates
    if: needs.check-for-updates.outputs.should_build == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          path: qmmp-src

      - name: Install Homebrew dependencies
        run: |
          brew update
          
          # Required dependencies
          brew install cmake ninja qt@6 libmad libvorbis libogg taglib curl
          
          # Optional dependencies (install what's available)
          brew install \
            mpg123 \
            flac \
            mpcdec \
            jack \
            libsoxr \
            libxmp \
            libsndfile \
            wavpack \
            pipewire \
            ffmpeg \
            libcdio \
            libcddb \
            faad2 \
            game-music-emu \
            opus \
            opusfile \
            wildmidi \
            sidplayfp \
            libbs2b \
            libprojectm \
            libarchive \
            libshout \
            enca \
            pkg-config || true

      - name: Configure with CMake
        run: |
          mkdir -p qmmp-src/build && cd qmmp-src/build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DUSE_ALSA=FALSE \
            -DUSE_OSS=FALSE \
            -DUSE_OSS4=FALSE \
            -DUSE_PULSE=FALSE \
            -DUSE_PIPEWIRE=FALSE \
            -DUSE_JACK=FALSE \
            -DUSE_QTMULTIMEDIA=TRUE \
            -DUSE_PROJECTM=TRUE \
            -DUSE_LIBCDDB=TRUE \
            -DQMMP_DEFAULT_UI=qsui
        env:
          LDFLAGS: "-L$(brew --prefix qt@6)/lib -L$(brew --prefix libogg)/lib -L$(brew --prefix libvorbis)/lib"
          CPPFLAGS: "-I$(brew --prefix qt@6)/include -I$(brew --prefix libogg)/include -I$(brew --prefix libvorbis)/include"
          PKG_CONFIG_PATH: "$(brew --prefix qt@6)/lib/pkgconfig:$(brew --prefix libogg)/lib/pkgconfig:$(brew --prefix libvorbis)/lib/pkgconfig"

      - name: Build
        run: |
          cd qmmp-src/build
          ninja -j$(sysctl -n hw.ncpu)

      - name: Install to staging directory
        run: |
          cd qmmp-src/build
          DESTDIR=${{ github.workspace }}/staging-macos ninja install

      - name: Create tarball
        run: |
          cd ${{ github.workspace }}
          tar -czf qmmp-${{ needs.check-for-updates.outputs.build_date }}-macos-arm64.tar.gz -C staging-macos .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmmp-macos
          path: qmmp-*-macos-arm64.tar.gz
          retention-days: 7

  # ==========================================================================
  # Job 5: Build on Windows (MSYS2/UCRT64)
  # ==========================================================================
  build-windows:
    needs: check-for-updates
    if: needs.check-for-updates.outputs.should_build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          path: qmmp-src

      - name: Setup MSYS2 with UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-libmad
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-libogg
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-mpg123
            mingw-w64-ucrt-x86_64-flac
            mingw-w64-ucrt-x86_64-libmpcdec
            mingw-w64-ucrt-x86_64-jack2
            mingw-w64-ucrt-x86_64-libsoxr
            mingw-w64-ucrt-x86_64-libxmp
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-wavpack
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-libcdio
            mingw-w64-ucrt-x86_64-libcddb
            mingw-w64-ucrt-x86_64-faad2
            mingw-w64-ucrt-x86_64-game-music-emu
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-libopusfile
            mingw-w64-ucrt-x86_64-wildmidi
            mingw-w64-ucrt-x86_64-sidplayfp
            mingw-w64-ucrt-x86_64-libbs2b
            mingw-w64-ucrt-x86_64-libprojectm
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-libshout
            mingw-w64-ucrt-x86_64-7zip

      - name: Configure with CMake
        run: |
          mkdir -p qmmp-src/build && cd qmmp-src/build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DUSE_ALSA=FALSE \
            -DUSE_OSS=FALSE \
            -DUSE_OSS4=FALSE \
            -DUSE_PULSE=FALSE \
            -DUSE_PIPEWIRE=FALSE \
            -DUSE_JACK=FALSE \
            -DUSE_NULL=TRUE \
            -DUSE_WAVEOUT=TRUE \
            -DUSE_DSOUND=TRUE \
            -DUSE_WASAPI=TRUE \
            -DUSE_QTMULTIMEDIA=TRUE \
            -DUSE_PROJECTM=TRUE \
            -DUSE_LIBCDDB=TRUE \
            -DQMMP_DEFAULT_UI=qsui \
            -DQMMP_DEFAULT_OUTPUT=wasapi

      - name: Build
        run: |
          cd qmmp-src/build
          ninja -j$(nproc)

      - name: Install to staging directory
        run: |
          cd qmmp-src/build
          DESTDIR=${{ github.workspace }}/staging-windows ninja install

      - name: Create 7z archive
        run: |
          cd ${{ github.workspace }}
          7z a -mx=9 qmmp-${{ needs.check-for-updates.outputs.build_date }}-windows-x86_64.7z ./staging-windows/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmmp-windows
          path: qmmp-*.7z
          retention-days: 7

  # ==========================================================================
  # Job 6: Create GitHub Release with all artifacts
  # ==========================================================================
  create-release:
    needs:
      - check-for-updates
      - build-linux-binary
      - build-linux-appimage
      - build-macos
      - build-windows
    if: needs.check-for-updates.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded Artifacts ==="
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.7z" -o -name "*.AppImage" \) | sort
          echo "============================"

      - name: Get recent changes
        id: changes
        run: |
          # Get changes since last nightly if exists
          LAST_SHA=""
          if gh release view nightly --json body -q '.body' 2>/dev/null; then
            LAST_SHA=$(gh release view nightly --json body -q '.body' | grep -oP 'Commit SHA: \K[a-f0-9]{40}' || echo "")
          fi
          
          {
            echo "changes_content<<CHANGEEOF"
            if [ -n "${LAST_SHA}" ]; then
              echo "## 📝 Recent Changes"
              echo ""
              git log "${LAST_SHA}..HEAD" --pretty=format:"- %s (%h)" --no-merges || echo "- Unable to retrieve changes"
              echo ""
            else
              echo "## 📝 Recent Changes"
              echo ""
              echo "First nightly build - showing last 15 commits:"
              echo ""
              git log -15 --pretty=format:"- %s (%h)" --no-merges || echo "- Unable to retrieve changes"
              echo ""
            fi
            echo "CHANGEEOF"
          } >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing nightly release
        run: |
          gh release delete nightly --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        run: |
          # Collect all archive files
          ARCHIVES=""
          for artifact_dir in artifacts/*/; do
            for file in "${artifact_dir}"*.tar.gz "${artifact_dir}"*.7z "${artifact_dir}"*.AppImage; do
              if [ -f "$file" ]; then
                ARCHIVES="${ARCHIVES} ${file}"
              fi
            done
          done
          
          if [ -z "${ARCHIVES}" ]; then
            echo "ERROR: No archives found!"
            find artifacts -type f | head -20
            exit 1
          fi
          
          # Create release body
          cat > release_body.md << RELEASEEOF
          # 🌙 Qmmp Nightly Build
          
          > **⚠️ Warning:** This is an automated nightly build from the \`master\` branch.
          > It may contain bugs, incomplete features, or breaking changes.
          > **Use at your own risk!** For stable releases, visit the [Releases](https://github.com/qmmp-dev/qmmp/releases) page.
          
          ---
          
          ## 📋 Build Information
          
          | Property | Value |
          |----------|-------|
          | **Build Date** | ${{ needs.check-for-updates.outputs.build_date }} |
          | **Commit SHA** | \`${{ needs.check-for-updates.outputs.short_sha }}\` |
          | **Full SHA** | \`${{ needs.check-for-updates.outputs.commit_sha }}\` |
