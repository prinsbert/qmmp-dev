          ## 📥 Installation
          
          ### Linux - Binary Tarball
          \`\`\`bash
          tar -xzf qmmp-*-linux-x86_64-binary.tar.gz
          sudo cp -r usr / && sudo cp -r etc / 2>/dev/null || true
          sudo ldconfig
          \`\`\`
          
          ### Linux - AppImage
          \`\`\`bash
          chmod +x qmmp-*-linux-x86_64.AppImage
          ./qmmp-*-linux-x86_64.AppImage
          \`\`\`
          
          ### macOS
          \`\`\`bash
          tar -xzf qmmp-*-macos-arm64.tar.gz
          sudo cp -r usr/local/* /usr/local/
          \`\`\`
          
          ### Windows
          1. Extract \`qmmp-*-windows-x86_64.7z\` to a folder
          2. Ensure MSYS2 UCRT64 \`bin\` directory is in PATH, or copy required DLLs
          3. Run \`bin\qmmp.exe\`
          
