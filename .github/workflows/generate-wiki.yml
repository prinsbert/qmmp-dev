name: Mirror SourceForge Wiki to GitHub Pages
on:
  #schedule:
  #  - cron: "0 6 * * 6"
  workflow_dispatch:
  push:
    branches: [ sourceforge-wiki ]
    paths:
      - '.github/workflows/wiki-mirror.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "wiki-mirror"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          pip install --no-input --disable-pip-version-check \
              requests beautifulsoup4 Markdown Pygments
      - name: Scrape SourceForge wiki and render HTML
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, html, time, pathlib, urllib.parse, collections
          import requests
          from bs4 import BeautifulSoup
          import markdown as md

          PROJECT = "qmmp-dev"
          WIKI    = f"https://sourceforge.net/p/{PROJECT}/wiki"
          OUT     = pathlib.Path("docs")
          (OUT / "assets").mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "github-actions-wiki-mirror/1.0 (+https://github.com/)",
              "Accept-Language": "en-US,en;q=0.9",
          })
          #  resilient fetcher (rate-limit / transient aware) 
          def get(url):
              for attempt in range(6):
                  try:
                      r = session.get(url, timeout=60)
                  except requests.RequestException:
                      if attempt == 5: raise
                      time.sleep(5 * (attempt + 1)); continue
                  if r.status_code == 200:
                      return r
                  if r.status_code in (429, 502, 503, 504):
                      time.sleep(8 * (attempt + 1)); continue
                  return r
              return r

          #  collect candidate page names from multiple sources 
          candidates = set()
          # (1) browse_pages -- the canonical Allura listing, paginated
          for page_idx in range(0, 100):
              r = get(f"{WIKI}/browse_pages?limit=500&page={page_idx}")
              if r.status_code != 200:
                  break
              soup = BeautifulSoup(r.text, "html.parser")
              before = len(candidates)
              for a in soup.select('a[href]'):
                  href = a.get("href", "")
                  m = re.search(rf"/p/{PROJECT}/wiki/([^/?#]+)/?$", href)
                  if m:
                      name = urllib.parse.unquote(m.group(1))
                      if name.lower() in {"browse_pages","raw","edit","history",
                                          "rename","revert","attach","source"}:
                          continue
                      candidates.add(name)
              if len(candidates) == before:   # nothing new on this page -> done
                  break
          # (2) Wiki home -- pick up sidebar/content links as a safety net
          r = get(WIKI + "/")
          if r.status_code == 200:
              for a in BeautifulSoup(r.text, "html.parser").select('a[href]'):
                  href = a.get("href", "")
                  m = re.search(rf"/p/{PROJECT}/wiki/([^/?#]+)/?$", href)
                  if m:
                      candidates.add(urllib.parse.unquote(m.group(1)))
          candidates.add("Home")
          print(f"Discovered {len(candidates)} candidate pages from listings")
          # (3) BFS-walk: fetch /raw for every candidate, also enqueue page names referenced inside markdown so we don't miss anything that wasn't listed.
          def slug_of(name):
              return re.sub(r"[^A-Za-z0-9._-]+", "_", name) or "page"
          visited = set()
          queue   = collections.deque(sorted(candidates))
          sources = {}    # page_name -> raw markdown text
          while queue:
              name = queue.popleft()
              if name in visited:
                  continue
              visited.add(name)
              url = f"{WIKI}/{urllib.parse.quote(name, safe='')}/raw"
              r = get(url)
              if r.status_code != 200:
                  continue
              src = r.text
              sources[name] = src
              # outbound wiki links referenced in markdown: [text](PageName)
              for m in re.finditer(r'\]\(\s*([^)\s]+)\s*\)', src):
                  target = m.group(1)
                  target = re.sub(r'[?#].*$', '', target).rstrip('/')
                  if not target or '://' in target or target.startswith('/'):
                      continue
                  target = urllib.parse.unquote(target)
                  if target not in visited and target not in queue:
                      queue.append(target)

              # politeness -- SourceForge is fine with a small per-request delay
              time.sleep(0.25)

          print(f"Fetched raw markdown for {len(sources)} pages "
                f"(BFS visited {len(visited)} names)")
          known_slugs = {slug_of(n) for n in sources}

          #  render markdown -> HTML and rewrite internal links 
          def looks_like_html(s):
              head = s.lstrip()[:200].lower()
              return head.startswith(("<!doctype", "<html", "<body", "<div", "<p"))
          def rewrite_html(h):
              def repl(m):
                  url = html.unescape(m.group(1))
                  mu = re.match(
                      rf"^https?://sourceforge\.net/p/{PROJECT}/wiki/([^/?#]+)/?(?:[?#].*)?$",
                      url,
                  )
                  if mu:
                      t = urllib.parse.unquote(mu.group(1))
                      if t in sources:
                          return f'href="{urllib.parse.quote(slug_of(t))}.html"'
                  # bare-name link like href="Home"
                  if url in sources:
                      return f'href="{urllib.parse.quote(slug_of(url))}.html"'
                  return m.group(0)
              return re.sub(r'href="([^"]*)"', repl, h)

          exts = ["extra","sane_lists","tables","fenced_code","codehilite","toc"]
          cfg  = {"codehilite": {"css_class": "codehilite", "guess_lang": True}}

          # ---- assets ----
          (OUT / "assets" / "style.css").write_text(r"""
          body {
              font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                          Roboto, "Helvetica Neue", Arial, sans-serif;
              line-height: 1.6; color: #1f2328;
              max-width: 980px; margin: 0 auto;
              padding: 1rem 1.5rem 5rem;
          }
          header { border-bottom: 1px solid #d0d7de; padding-bottom: .5rem;
                  margin-bottom: 1.5rem; font-size: 1.05rem; }
          header a { text-decoration: none; color: #0969da; font-weight: 600; }
          main h1 { font-size: 2rem; margin-bottom: 1rem;
                  border-bottom: 1px solid #d0d7de; padding-bottom: .3rem; }
          article h1, article h2, article h3 { margin-top: 1.6em; }
          article h1 { font-size: 1.6rem; border: none; padding: 0; margin-top: 0; }
          a { color: #0969da; }
          pre, code { background: #f6f8fa; }
          pre { padding: 1em; overflow: auto; border-radius: 6px; }
          table { border-collapse: collapse; }
          th, td { border: 1px solid #d0d7de; padding: .35em .7em; }
          img { max-width: 100%; height: auto; }
          .meta { font-size: .85rem; color: #57606a; margin-top: 2rem;
                  border-top: 1px solid #d0d7de; padding-top: .8rem; }
          ul#index li { margin: .25em 0; }
          .codehilite { background: #f6f8fa; padding: 1em; border-radius: 6px; overflow: auto; }
          .codehilite pre { background: transparent; padding: 0; }
          """, encoding="utf-8")

          (OUT / ".nojekyll").write_text("")   # bypass Jekyll

          PAGE_TPL = """<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>{title} – qmmp-dev Wiki (mirror)</title>
          <link rel="stylesheet" href="assets/style.css">
          </head>
          <body>
            <header><a href="index.html">qmmp-dev Wiki – SourceForge mirror</a></header>
            <main>
              <h1>{title}</h1>
              <article>
          {body}
              </article>
              <p class="meta">Source: <a href="{href}">{href}</a></p>
            </main>
          </body>
          </html>
          """

          for name, src in sources.items():
              if looks_like_html(src):
                  body_html = src            # page stored as raw HTML, pass through
              else:
                  body_html = md.markdown(src, extensions=exts, extension_configs=cfg)
              body_html = rewrite_html(body_html)

              html_out = PAGE_TPL.format(
                  title = html.escape(name),
                  body  = body_html,
                  href  = html.escape(f"{WIKI}/{urllib.parse.quote(name, safe='')}/"),
              )
              (OUT / f"{slug_of(name)}.html").write_text(html_out, encoding="utf-8")

          # ---- index page ----
          rows = "\n".join(
              f'  <li><a href="{urllib.parse.quote(slug_of(n))}.html">{html.escape(n)}</a></li>'
              for n in sorted(sources, key=str.lower)
          )
          index = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>qmmp-dev Wiki (SourceForge mirror)</title>
          <link rel="stylesheet" href="assets/style.css">
          </head>
          <body>
            <header><a href="index.html">qmmp-dev Wiki – SourceForge mirror</a></header>
            <main>
              <h1>qmmp-dev Wiki</h1>
              <p>Mirror of <a href="https://sourceforge.net/p/qmmp-dev/wiki/">the SourceForge wiki</a>.
                 Page sources are fetched via <code>/raw</code> and rendered with Python-Markdown.</p>
              <ul id="index">
          {rows}
              </ul>
            </main>
          </body>
          </html>
          """
          (OUT / "index.html").write_text(index, encoding="utf-8")
          print(f"Wrote {len(sources)} pages under docs/")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
